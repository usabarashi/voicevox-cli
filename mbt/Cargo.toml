[workspace]

[package]
name = "voicevox-cli-mbt"
version = "0.0.0"
edition = "2024"
rust-version = "1.89.0"
publish = false

# The model-based tests link against the real library and connect it to the
# Quint specs. They are only ever run from the Nix devShell, where `quint` is
# available on PATH.
[dependencies]
voicevox-cli = { path = ".." }

[dev-dependencies]
quint-connect = "0.1.2"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
