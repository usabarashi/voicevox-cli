name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    # Nightly random-seed model-based test exploration (UTC). PR/push runs pin
    # QUINT_SEED for determinism; this explores different traces.
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
      modeling: ${{ steps.filter.outputs.modeling }}
      mbt: ${{ steps.filter.outputs.mbt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for path changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            build:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/ci.yml'
            modeling:
              - 'modeling/**'
              # verify.sh also machine-checks production constants, so a
              # source-only change can drift them; run the gate for src too.
              - 'src/**'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/ci.yml'
            mbt:
              # The MBT tests connect the Quint specs to production code, so a
              # change to either side (or to the driver crate) must run them.
              - 'modeling/quint/**'
              - 'mbt/**'
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'flake.nix'
              - 'flake.lock'
              - 'scripts/voicevox-setup.sh'
              - '.github/workflows/ci.yml'

  build-and-test:
    name: Build & Test (Apple Silicon)
    needs: changes
    if: >-
      needs.changes.outputs.build == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix with cache
        uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31.10.4
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cachix
        uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        continue-on-error: true # cachix daemon stop returns exit 1 on cleanup
        with:
          name: voicevox-cli
          extraPullNames: nix-community
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-
          gc-max-store-size-macos: 5G
          purge: ${{ github.event_name == 'push' }}
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: 604800

      - name: Run Nix flake checks
        run: nix flake check --accept-flake-config --show-trace

      - name: Build with Nix
        run: nix build --accept-flake-config --show-trace

      - name: Run security audit
        run: |
          # RUSTSEC-2026-0009: time crate DoS via stack exhaustion (transitive dep from voicevox_core, awaiting upstream fix)
          nix develop --accept-flake-config --command cargo audit --ignore RUSTSEC-2026-0009

      - name: Verify build artifacts
        run: |
          test -d result/bin
          test -x result/bin/voicevox-say
          test -x result/bin/voicevox-daemon
          test -x result/bin/voicevox-mcp-server
          test -x result/bin/voicevox-setup
          echo "All build artifacts verified"

      - name: Test functionality
        run: |
          result/bin/voicevox-say --help
          result/bin/voicevox-daemon --help
          result/bin/voicevox-mcp-server --help
          result/bin/voicevox-setup --help

      - name: Warm up cache (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          nix-store -qR ./result | cachix push voicevox-cli

  quint-verify:
    name: Quint Verification (TLC backend)
    needs: changes
    if: >-
      needs.changes.outputs.modeling == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix with cache
        uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31.10.4
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Quint verification gate
        run: |
          nix develop --accept-flake-config --command bash modeling/quint/verify.sh

  quint-mbt:
    name: Quint Model-Based Testing
    needs: changes
    if: >-
      needs.changes.outputs.mbt == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix with cache
        uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31.10.4
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run model-based tests
        run: |
          # QUINT_SEED is read by quint-connect at compile time (option_env!),
          # so a fixed seed makes the generated traces deterministic in CI.
          # Omit or change it locally to explore different traces.
          nix develop --accept-flake-config --command bash -c \
            'QUINT_SEED=0x5eed cargo test --locked --manifest-path mbt/Cargo.toml -- --test-threads=1'

  # Broad exploration: the PR/push jobs pin QUINT_SEED for deterministic traces.
  # This scheduled job leaves it unset (quint-connect picks a random seed), so
  # each shard explores a different set of traces.
  quint-mbt-explore:
    name: Quint MBT (random seed exploration)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix with cache
        uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31.10.4
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run model-based tests (random seed)
        run: |
          nix develop --accept-flake-config --command bash -c \
            'cargo test --locked --manifest-path mbt/Cargo.toml -- --test-threads=1'

  quint-mbt-daemon:
    name: Quint MBT (real daemon)
    needs: changes
    if: >-
      needs.changes.outputs.mbt == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix with cache
        uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31.10.4
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # The daemon needs the ONNX Runtime resource to start, and synthesis
      # additionally needs voice models and the OpenJTalk dictionary. Cache them
      # in the default XDG location so the app finds them without extra
      # environment variables. The key includes the platform, the
      # resource-provisioning definitions, and a manually bumped `models-v1`
      # generation: bump it whenever the required model set changes so a cache
      # holding a stale/incomplete model set is never reused. The restore key is
      # deliberately omitted (exact-match only) for the same reason.
      - name: Cache VOICEVOX resources
        id: resources-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/voicevox
          key: voicevox-resources-models-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'scripts/voicevox-setup.sh') }}

      # The downloader reports "all required files downloaded" even when it
      # skipped `.vvm` files it believed were already present. A partial cache
      # (onnxruntime + dict but no models) therefore used to be treated as
      # complete and the step still exited 0, leaving the real-daemon MBT to
      # fail later with "No VOICEVOX models found".
      #
      # (The license text is shown through the `minus` pager, which panics on a
      # non-UTF-8 boundary when stdout is not a TTY. That panic is cosmetic: a
      # clean download still fetches every `.vvm` and exits 0.)
      #
      # Recreate a clean resources directory whenever the cache restore did not
      # actually bring models, then download everything (models included) so the
      # downloader cannot skip. Fail loudly afterwards if `.vvm` files are still
      # missing. GH_TOKEN avoids the unauthenticated GitHub API rate limit.
      - name: Provision VOICEVOX resources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No `pipefail`: `yes` is killed by SIGPIPE (exit 141) once the
          # downloader closes stdin, which would otherwise fail the step on an
          # otherwise successful download.
          set -eu
          RESOURCES_DIR="$HOME/.local/share/voicevox"
          MODELS_DIR="$RESOURCES_DIR/models"

          # Force a full download when no `.vvm` file was restored: a stale
          # partial cache must not be trusted, and a clean directory cannot be
          # mistaken for "resources already present".
          if [ -z "$(find "$MODELS_DIR" -name '*.vvm' -print -quit 2>/dev/null)" ]; then
            echo "No voice models in the restored resources; downloading a clean copy."
            rm -rf "$RESOURCES_DIR"
          fi

          # `voicevox-setup` is interactive: its confirmation prompt consumes the
          # single piped line, leaving the downloader's license prompt with empty
          # stdin in CI. Call the downloader directly and feed `yes` for the
          # license agreement. The downloader's own exit status is checked
          # explicitly (the pipeline's status is `yes`'s, which is SIGPIPE).
          nix build --accept-flake-config
          downloader_status=0
          yes | ./result/bin/voicevox-download \
            --only onnxruntime --only dict --only models \
            --output "$RESOURCES_DIR" || downloader_status=$?
          if [ "$downloader_status" -ne 0 ]; then
            echo "::error::voicevox-download exited with status $downloader_status" >&2
            exit 1
          fi

          model_count=$(find "$MODELS_DIR" -name '*.vvm' 2>/dev/null | wc -l | tr -d ' ')
          echo "Voice models present: $model_count"
          if [ "$model_count" -eq 0 ]; then
            echo "::error::Provisioning completed but no .vvm files were downloaded; the real-daemon MBT cannot run." >&2
            exit 1
          fi

      - name: Run real-daemon MBT (IPC + synthesize + streaming)
        run: |
          nix develop --accept-flake-config --command bash -c '
            set -euo pipefail
            cargo build --locked --bin voicevox-daemon
            QUINT_SEED=0x5eed cargo test --locked --manifest-path mbt/Cargo.toml --test daemon_ipc \
              -- --ignored --test-threads=1
            QUINT_SEED=0x5eed cargo test --locked --manifest-path mbt/Cargo.toml --test daemon_synthesize \
              -- --ignored --test-threads=1
            QUINT_SEED=0x5eed cargo test --locked --manifest-path mbt/Cargo.toml --test daemon_serialization \
              -- --ignored --test-threads=1
            QUINT_SEED=0x5eed cargo test --locked --manifest-path mbt/Cargo.toml --test streaming_synthesis \
              -- --ignored --test-threads=1
          '
