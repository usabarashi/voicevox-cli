[package]
name = "voicevox-cli-mbt"
version = "0.0.0"
edition = "2024"
rust-version = "1.89.0"
publish = false

# The model-based tests link against the real library and connect it to the
# Quint specs. They are only ever run from the Nix devShell, where `quint` is
# available on PATH.
[dependencies]
voicevox-cli = { path = ".." }

[dev-dependencies]
quint-connect = "0.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
itf = "0.4"
postcard = { version = "1.1", features = ["alloc"] }
anyhow = "1.0"
tokio = { version = "1.51", features = ["rt-multi-thread", "time", "net", "sync", "io-util"] }
tempfile = "3.27"

# Helper process for `tests/model_presence.rs`. It evaluates the production
# presence predicates in a fresh process configured through `Command::env`, so
# the driver never mutates its own process environment (`std::env::set_var` is
# unsafe under concurrency).
[[bin]]
name = "model_presence_probe"
path = "src/bin/model_presence_probe.rs"
